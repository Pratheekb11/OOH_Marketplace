services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adspace
      POSTGRES_USER: adspace
      POSTGRES_PASSWORD: adspace
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adspace -d adspace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
