# Weekly dependency PRs. Grouped so a quiet week produces one PR per ecosystem
# instead of six, and capped so a busy week cannot bury real work.
version: 2

updates:
  - package-ecosystem: npm
    directory: /MVP/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next/React/Tailwind majors are deliberate, re-tested decisions (see the
      # Tailwind v3-not-v4 note in MVP/IMPLEMENTATION_NOTES.md), so majors stay
      # as individual PRs while patch/minor noise gets batched into one.
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /MVP/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      legacy-backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
