name: CI

# Lint, type-check, build and test on every push to a long-lived branch and on
# every pull request. Everything here runs on GitHub-hosted runners: the build
# is Node + Python only, with no services and no private hardware.

on:
  push:
    branches: [main, MVP]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless, so cancel it.
# (deploy-pages.yml deliberately does the opposite -- a half-applied deploy is
# worse than a wasted minute.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MVP/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MVP/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        # `next build` type-checks too, but a dedicated step names the failure
        # "TypeScript" instead of burying it in build output.
        run: npx tsc --noEmit

      - name: Unit tests
        # Vitest + jsdom component tests (src/**/*.test.ts[x]).
        run: npm test

      - name: Build
        # The real gate. `next dev` tolerates a missing <Suspense> around
        # useSearchParams(), un-awaited params/searchParams (both Promises in
        # Next 15) and RSC boundary violations; `next build` hard-fails on all
        # three. NEXT_PUBLIC_API_BASE_URL is left unset on purpose -- the build
        # must not need a reachable API.
        run: npm run build

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both FastAPI services are tested. MVP/backend is what Vercel serves;
        # backend/ is the older, fuller service (VAS orders, invoices, admin
        # review, scraper) that MVP/backend was cut down from, and it still has
        # its own suite.
        service: [MVP/backend, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        working-directory: ${{ matrix.service }}
        # Config lives in the repo-root ruff.toml; ruff finds it by walking up.
        run: |
          pip install -r "$GITHUB_WORKSPACE/MVP/backend/requirements-dev.txt"
          ruff check .

      - name: Pytest
        working-directory: ${{ matrix.service }}
        # No .env and no secrets: app/config.py's defaults already point at a
        # local SQLite file, and conftest.py swaps in a fresh in-memory DB per
        # test, so nothing here touches a real database, S3, SMTP or a payment
        # gateway.
        run: pytest -q
